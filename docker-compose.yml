services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archguard}
      POSTGRES_USER: ${POSTGRES_USER:-archguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archguard-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ARCHGUARD_APP_NAME: ${ARCHGUARD_APP_NAME:-ArchGuard AI}
      ARCHGUARD_ENVIRONMENT: ${ARCHGUARD_ENVIRONMENT:-development}
      ARCHGUARD_DEBUG: ${ARCHGUARD_DEBUG:-false}
      ARCHGUARD_LOG_LEVEL: ${ARCHGUARD_LOG_LEVEL:-INFO}
      ARCHGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-archguard}:${POSTGRES_PASSWORD:-archguard-local-only}@postgres:5432/${POSTGRES_DB:-archguard}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
