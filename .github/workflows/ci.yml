name: foundation-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.0
          uv sync --locked --extra dev
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Tests
        run: make test
      - name: Compose configuration
        run: docker compose config --quiet
